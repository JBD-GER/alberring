project_id = "alberring-connect"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/accept-invite",
  "http://localhost:5173/reset-password",
]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# These automation endpoints authenticate their own high-entropy secret before
# creating a service-role client. The public gateway therefore must not expect
# an end-user JWT for them.
[functions.process-birthday-reminders]
verify_jwt = false

[functions.process-mileage-reminders]
verify_jwt = false

[functions.process-scheduled-news]
verify_jwt = false

[functions.send-notification-batch]
verify_jwt = false
