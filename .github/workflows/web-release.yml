name: Verified Vercel production deployment
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify current main head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_commit" = "$VERIFIED_COMMIT" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skipping stale deployment.'
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx --yes vercel@59.20.0 pull --yes --environment=production
      - run: npx --yes vercel@59.20.0 build --prod
      - run: npm run security:check
      - if: steps.current.outputs.deploy == 'true'
        run: npx --yes vercel@59.20.0 deploy --prebuilt --prod --yes
