apply plugin: 'com.android.application'

def releaseVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../mobile-version.json'))
def appVersion = System.getenv('APP_VERSION') ?: releaseVersion.version
def appBuildNumber = (System.getenv('BUILD_NUMBER') ?: releaseVersion.buildNumber).toString().toInteger()
def signingNames = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def signingValues = signingNames.collect { System.getenv(it) }
def releaseSigning = signingValues.every { it != null && !it.isBlank() }
if (signingValues.any { it != null && !it.isBlank() } && !releaseSigning) {
    throw new GradleException('Provide all Android signing environment variables or none.')
}
if (!(appVersion ==~ /\d+\.\d+\.\d+/) || appBuildNumber < 1 || appBuildNumber > 2100000000) {
    throw new GradleException('Invalid mobile release version or build number.')
}

android {
    namespace = "de.alberring.connect"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.alberring.connect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appBuildNumber
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'Alberring Dev'
        }
        release {
            if (releaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('Firebase configuration absent: push registration remains disabled until google-services.json is supplied.')
}
