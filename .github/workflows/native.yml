name: Native compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: ios
        options: [ios, android, all]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-public-anon-key
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run mobile:sync
      - run: ./gradlew --no-daemon assembleDebug bundleRelease lintDebug :app:assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-only
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build:native && npm run mobile:version && npx cap sync ios
      - run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
